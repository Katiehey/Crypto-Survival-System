name: Daily Bot Report

on:
  schedule:
    - cron: "0 5 * * *"  # 7am SAST (UTC+2) — runs on GitHub, MacBook not needed
  workflow_dispatch:       # allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H 64.181.218.172 >> ~/.ssh/known_hosts

      - name: Pull bot logs from Oracle
        run: |
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no opc@64.181.218.172 \
            "tmux capture-pane -t crypto-survival-system:bot -p | tail -100" > /tmp/bot_logs.txt

      - name: Send Telegram report
        run: python3 .github/scripts/daily_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
