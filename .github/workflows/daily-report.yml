name: Daily Bot Report

on:
  schedule:
    - cron: "0 5 * * *"  # 7am SAST (UTC+2) — runs on GitHub, MacBook not needed
  workflow_dispatch:       # allow manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H 34.61.133.138 >> ~/.ssh/known_hosts

      - name: Pull bot logs from GCP
        run: |
          # Pull today's and yesterday's log files from GCP
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no admin@34.61.133.138 \
            "find /home/admin/Crypto-Survival-System/logs -name 'bot_*.log' -mtime -2 2>/dev/null | sort | xargs cat 2>/dev/null || echo ''" > /tmp/bot_logs.txt
          echo "Log lines: $(wc -l < /tmp/bot_logs.txt)"

      - name: Send Telegram report
        run: python3 .github/scripts/daily_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
