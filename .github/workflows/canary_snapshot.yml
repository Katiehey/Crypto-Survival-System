name: Canary Snapshot & PSI Check

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      MODEL_DIR: models/production/production_retrained_winsor_quantile_long
      PYTHONPATH: .
      DB_PATH: data/trading.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare CI DB (create minimal candles table)
        run: |
          mkdir -p data
          DB_PATH=data/trading.db PYTHONPATH=. python3 scripts/ci_prepare_db.py

      - name: Assert CI DB
        run: |
          DB_PATH=data/trading.db PYTHONPATH=. python3 scripts/check_db.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install ccxt || true

      - name: Write status snapshot
        run: |
          PYTHONPATH=. python3 scripts/write_status_snapshot.py --model-dir "$MODEL_DIR" || true

      - name: Run PSI check
        run: |
          PYTHONPATH=. python3 scripts/run_psi_check.py --model-dir "$MODEL_DIR" || true

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-snapshots
          path: backtest_results/status/

      - name: Post notification on ALERT (best effort)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODEL_DIR: ${{ env.MODEL_DIR }}
        run: |
          # If there's an ALERT recorded in the model dir, attempt to notify
          if [ -f "$MODEL_DIR/psi_check.json" ]; then
            PYTHONPATH=. python3 - <<'PY'
            import json, os, subprocess
            f = os.getenv('MODEL_DIR') + '/psi_check.json'
            try:
                data = json.load(open(f))
                if data.get('overall_status') == 'ALERT':
                    print('ALERT detected, attempting Telegram notify')
                    subprocess.run(['python3', 'scripts/notify_telegram.py', '--message', 'PSI ALERT detected in scheduled snapshot'], check=False)
            except Exception as e:
                print('No valid psi_check.json or parse error', e)
            PY
