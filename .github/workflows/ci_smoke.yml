name: CI - Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DB_PATH: data/trading.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install scikit-learn || true

      - name: 'Preflight: ensure .env not committed'
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env file is tracked in git. This is a security risk. Remove it before merging." >&2
            git ls-files --error-unmatch .env || true
            exit 1
          else
            echo ".env not present in tracked files"
          fi

      - name: Prepare CI DB (create minimal candles table)
        run: |
          mkdir -p data
          DB_PATH=data/trading.db PYTHONPATH=. python3 scripts/ci_prepare_db.py

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q || true

      - name: Validate exchange credentials
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
        run: |
          PYTHONPATH=. python3 scripts/validate_exchange_credentials.py || true

      - name: Run production smoke
        continue-on-error: true
        run: |
          PYTHONPATH=. python3 scripts/run_production_smoke.py || true

      - name: Run PSI check (create exit status)
        id: psi_check
        continue-on-error: true
        run: |
          find models/production -type f -name 'psi_baseline.json' -print -delete || true
          PYTHONPATH=. python3 scripts/run_psi_check.py --model-dir models/production/production_retrained_winsor_quantile_long || true
          echo "PSI_EXIT_CODE=$?" > psi_status.txt

      - name: Check PSI alerts for non-whitelisted features
        continue-on-error: true
        run: |
          PYTHONPATH=. python3 scripts/check_psi_alerts.py || (cat models/production/production_retrained_winsor_quantile_long/psi_check.json || true; exit $?)

      - name: Notify on PSI alert
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PSI_EXIT=$(cat psi_status.txt | cut -d'=' -f2)
          echo "PSI_EXIT=$PSI_EXIT"
          if [ "$PSI_EXIT" != "0" ]; then
            PYTHONPATH=. python3 -c "from monitoring.alerts import send_telegram_alert; send_telegram_alert('CI: PSI ALERT detected during CI smoke job')" || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-summary
          path: backtest_results/production_smoke_summary.json

      - name: Upload PSI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-check
          path: |
            psi_status.txt
            psi_check.json
            models/production/**/psi_check.json
            backtest_results/psi_diagnostics/**

