name: CI - Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preflight: ensure .env not committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env file is tracked in git. This is a security risk. Remove it before merging." >&2
            git ls-files --error-unmatch .env || true
            exit 1
          else
            echo ".env not present in tracked files"
          fi
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure scikit-learn is available for PSI model unpickling and checks
          pip install scikit-learn
      - name: Prepare CI DB (create minimal candles table)
        run: |
          PYTHONPATH=. python3 scripts/ci_prepare_db.py
      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q || true
      - name: Run histogram-count integration test
        run: |
          # Run only the histogram-count test to fail fast if histograms are degenerate
          PYTHONPATH=. pytest -q tests/test_histogram_counts.py::test_histogram_min_counts
      - name: Validate exchange credentials
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          TRADING_PAIR: ${{ secrets.TRADING_PAIR }}
        run: |
          PYTHONPATH=. python3 scripts/validate_exchange_credentials.py

      - name: Run production smoke
        continue-on-error: true
        run: |
          PYTHONPATH=. python3 scripts/run_production_smoke.py
      - name: Run PSI check (create exit status)
        id: psi_check
        continue-on-error: false
        run: |
          # Remove any stale baseline so CI creates a fresh baseline from the CI DB
          find models/production -type f -name 'psi_baseline.json' -print -delete || true
          PYTHONPATH=. python3 scripts/run_psi_check.py
          echo "PSI_EXIT_CODE=$?" > psi_status.txt
      - name: Notify on PSI alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PSI_EXIT=$(cat psi_status.txt | cut -d'=' -f2)
          echo "PSI_EXIT=$PSI_EXIT"
          if [ "$PSI_EXIT" != "0" ]; then
            PYTHONPATH=. python3 -c "from monitoring.alerts import send_telegram_alert; send_telegram_alert('CI: PSI ALERT detected during CI smoke job')"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-summary
          path: |
            backtest_results/production_smoke_summary.json

      - name: Upload PSI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-check
          path: |
            psi_status.txt
            psi_check.json
            models/production/**/psi_check.json
            backtest_results/psi_diagnostics/**
