name: Weekly Bot Optimizer

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 10am SAST (UTC+2) — runs on GitHub, MacBook not needed
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H 34.61.133.138 >> ~/.ssh/known_hosts

      - name: Pull logs and params from Oracle
        run: |
          # Pull last 7 days of log files from confirmed path: /home/admin/Crypto-Survival-System/logs/
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no admin@34.61.133.138 \
            "find /home/admin/Crypto-Survival-System/logs -name 'bot_*.log' -mtime -7 2>/dev/null | xargs cat 2>/dev/null || echo ''" > /tmp/tick_logs.txt
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=no admin@34.61.133.138 \
            "grep 'VOLUME_SPIKE_MIN\|RSI_RANGE_BUY_MAX\|RSI_TREND_BUY_MIN\|ADX_TREND_THRESHOLD' /home/admin/Crypto-Survival-System/.env" > /tmp/oracle_params.txt
          echo "Log lines pulled: $(wc -l < /tmp/tick_logs.txt)"

      - name: Analyse blockers
        id: analysis
        run: |
          python3 .github/scripts/analyse_blockers.py | tee /tmp/analysis.txt
          echo "decision=$(grep '^DECISION=' /tmp/analysis.txt | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "proposed=$(grep '^PROPOSED=' /tmp/analysis.txt | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "current_vol=$(grep '^CURRENT_VOL=' /tmp/analysis.txt | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Run baseline backtest
        if: steps.analysis.outputs.decision != 'none'
        run: python bot.py --backtest --backtest-days 400 2>&1 | tee /tmp/baseline.txt
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TRADING_MODE: paper
          TRADING_PAIR: BTC/USDT
          TIMEFRAME: 1h
          STARTING_CAPITAL: "30"
          LOG_LEVEL: WARNING

      - name: Run proposed backtest
        if: steps.analysis.outputs.decision != 'none'
        run: python bot.py --backtest --backtest-days 400 2>&1 | tee /tmp/proposed.txt
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TRADING_MODE: paper
          TRADING_PAIR: BTC/USDT
          TIMEFRAME: 1h
          STARTING_CAPITAL: "30"
          LOG_LEVEL: WARNING
          VOLUME_SPIKE_MIN: ${{ steps.analysis.outputs.proposed }}

      - name: Send Telegram proposal
        if: steps.analysis.outputs.decision != 'none'
        run: python3 .github/scripts/send_optimizer_proposal.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURRENT_VOL: ${{ steps.analysis.outputs.current_vol }}
          PROPOSED_VOL: ${{ steps.analysis.outputs.proposed }}

      - name: Send no-change report
        if: steps.analysis.outputs.decision == 'none'
        run: |
          REASON=$(grep '^REASON=' /tmp/analysis.txt | cut -d= -f2-)
          python3 -c "
          import os, urllib.request, urllib.parse
          from datetime import datetime, timezone
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          msg = f'Bot Optimizer - {date}\n\nNo parameter change needed.\n$REASON'
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
          urllib.request.urlopen(url, data)
          "
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
