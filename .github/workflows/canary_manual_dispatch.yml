name: Canary Manual Dispatch

on:
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      MODEL_DIR: models/production/production_retrained_winsor_quantile_long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install ccxt || true

      - name: Write status snapshot
        run: |
          python3 scripts/write_status_snapshot.py --model-dir "$MODEL_DIR"

      - name: Run PSI check
        run: |
          python3 scripts/run_psi_check.py --model-dir "$MODEL_DIR" || true

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: psi-snapshots
          path: backtest_results/status/
