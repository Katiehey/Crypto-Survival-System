name: Keepalive

# ---------------------------------------------------------------------------
# Why this exists
#
# GitHub automatically disables *scheduled* workflows after 60 days of
# repository inactivity (no commits / pushes). That is what killed
# "Daily Bot Report" on 2026-10-29: the last push was 2026-08-30, i.e. exactly
# 60 days earlier. Running a workflow on a schedule does NOT count as activity,
# and re-enabling a workflow does NOT reset the timer — only a new commit/push
# does.
#
# This workflow makes a one-line commit on the 1st of every month. That single
# push resets the 60-day inactivity clock for EVERY scheduled workflow in the
# repo (including this one), so none of them can be auto-disabled again.
#
# As a belt-and-suspenders measure it also re-enables any scheduled workflow
# GitHub has disabled, in case one slips past the 60-day window.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 6 1 * *"   # 08:00 SAST on the 1st of every month (< 60 days)
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write   # needed to push the keepalive commit
  actions: write    # needed to re-enable disabled workflows

# Never run two keepalives at once.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit a timestamp to reset the inactivity clock
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit — repo already active."
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Re-enable any workflow GitHub disabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Enable by ID rather than by name: `gh workflow enable "<display name>"`
          # fails to resolve names, but the workflow ID always works.
          gh workflow list --all --repo "$REPO" --json id,name,state \
            | jq -r '.[] | select(.state != "active") | "\(.id)\t\(.name)"' \
            | while IFS=$'\t' read -r id name; do
                if [ -n "$id" ]; then
                  echo "Re-enabling '$name' (id=$id)"
                  gh workflow enable "$id" --repo "$REPO" || true
                fi
              done
          echo "All scheduled workflows are enabled."
