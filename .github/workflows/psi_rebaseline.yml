name: PSI Rebaseline (manual)

on:
  workflow_dispatch:
    inputs:
      model_dir:
        description: 'Model directory to rebaseline (defaults to latest in models/production)'
        required: false
      buckets:
        description: 'Number of buckets for baseline quantiles'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run rebaseline and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL_DIR="${{ github.event.inputs.model_dir }}"
          if [ -z "$MODEL_DIR" ]; then
            echo 'No model_dir provided, will use latest in models/production'
            python3 scripts/rebaseline.py --commit --buckets ${{ github.event.inputs.buckets }}
          else
            python3 scripts/rebaseline.py --model-dir "$MODEL_DIR" --commit --buckets ${{ github.event.inputs.buckets }}
